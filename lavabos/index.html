<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>A-Frame — Final Escape Room</title>
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://agarci9inscastellet.github.io/scaperoom/js/scaperoom.js"></script>
  
  <script>
    if (new URLSearchParams(window.location.search).has('clear')){
      resetStatus();
    }
  </script>

  <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" type="text/css"/>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js" type="text/javascript"></script>
</head>

<body>
  <a-scene cursor="rayOrigin: mouse" renderer="antialias: true; colorManagement: true">
    
    <a-assets>
      <a-asset-item id="bathModel" src="lavabos.glb"></a-asset-item>
      <a-asset-item id="noteModel1" src="../assets/note.glb"></a-asset-item>
      <a-asset-item id="doorModel" src="../assets/door2.glb"></a-asset-item>
      <a-asset-item id="modelCassette" src="../assets/cassette.glb"></a-asset-item>
    </a-assets>

    <a-entity gltf-model="#bathModel" 
              position="1550 -50 1340" 
              rotation="0 0 0" 
              scale="1 1 1">
    </a-entity>

    <a-entity class="clickable" 
              data-note-id="note2" 
              gltf-model="#noteModel1" 
              id="note2" 
              position="83.17516 0.07182 53.52107" 
              rotation="-90 45 0" 
              scale="2 2 2">
    </a-entity>

    <a-entity class="aframe-clickable" 
              gltf-model="#doorModel" 
              id="door2" 
              position="-40 -50.70453 61.39498" 
              rotation="0 90 0" 
              scale="0.4 0.4 1">
    </a-entity>

    <a-entity class="aframe-clickable" 
              gltf-model="#doorModel" 
              id="door2-2" 
              position="-40 -50.705 8.32393" 
              rotation="0 90 0" 
              scale="0.4 0.4 1">
    </a-entity>

    <a-entity id="cassette5" 
              class="clickable" 
              gltf-model="#modelCassette" 
              position="129 -49 -143" 
              scale="40 40 40">
    </a-entity>

    <a-entity id="sound" sound="autoplay: false; positional: false"></a-entity>

    <a-sphere class="teleport" color="#FF0000" position="80.17 -20 0.52" radius="3"></a-sphere>
    <a-sphere class="teleport" color="#FF0000" position="0 -20 0" radius="3"></a-sphere>
    <a-sphere class="teleport" color="#FF0000" position="80 -20 -70" radius="3"></a-sphere>
    <a-sphere class="teleport" color="#FF0000" position="0 -20 -64" radius="3"></a-sphere>

    <a-entity id="playerRig" position="0 0 0" rotation="0 -90 0">
      <a-entity camera look-controls>
        <a-cursor fuse="false" raycaster="objects: .clickable, .teleport, .aframe-clickable"></a-cursor>
      </a-entity>
    </a-entity>

    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 1" position="105 -190 5"></a-entity>

    <script>
      // Componente de teletransporte
      AFRAME.registerComponent('teleport-on-click', {
        init: function () {
          const spheres = document.querySelectorAll('.teleport');
          const player = document.getElementById('playerRig');
          spheres.forEach(sphere => {
            sphere.addEventListener('click', () => {
              const pos = sphere.getAttribute('position');
              player.setAttribute('position', {x: pos.x, y: pos.y + 20, z: pos.z});
            });
          });
        }
      });
      document.querySelector('a-scene').setAttribute('teleport-on-click', '');

      // Lógica de juego al cargar el DOM
      document.addEventListener('DOMContentLoaded', () => {
        // Cargar preguntas si es necesario (aunque aquí se use questionGate con ID 0)
        
        // 1. Manejo de Puertas y Notas (Funciones de scaperoom.js)
        if(typeof questionGate === "function") {
          questionGate("#door2", 0, "../inici/index.html", "status_nota 1");
          questionGate("#door2-2", 0, "../inici/index.html", "status_nota 2");
          catchableObject("#note2", "status_nota 2", "📝2");
        }

        // 2. Control del Spawn por URL
        const urlParams = new URLSearchParams(window.location.search);
        const spawnPoint = urlParams.get('pos');
        const player = document.getElementById('playerRig');
        if (player) {
          if (spawnPoint === '2') player.setAttribute('position', '0 0 0');
          else if (spawnPoint === '1') player.setAttribute('position', '-4.9 0 -66.4');
        }

        // 3. Lógica del Cassette (DESAPARECER Y SONAR)
        const cassette = document.querySelector("#cassette5");
        if (cassette) {
          cassette.addEventListener("click", function() {
            console.log("Cassette activado");
            if (typeof playAudio === "function") {
              playAudio("lavabo");
            }

            // Hacer desaparecer el cassette
            this.setAttribute("visible", false);
            
            // Quitar la clase para que el cursor ya no lo detecte
            this.classList.remove("clickable");
          });
        }
      });
    </script>
  </a-scene>
  <script src="../js/audios.js"></script>
  <script src="../js/note-system.js"></script>
</body>
</html>
