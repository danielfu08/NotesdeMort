<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Mi Escena A-Frame</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://agarci9inscastellet.github.io/scaperoom/js/scaperoom.js"></script>
<script defer="">
     if (new URLSearchParams(window.location.search).has('clear')){
      resetStatus();
     }

  </script>
<link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" type="text/css"/>
<script src="https://cdn.jsdelivr.net/npm/toastify-js" type="text/javascript"></script>
</head>
<body>
<a-scene>
<!-- Cielo -->
<a-sky color="#87CEEB"></a-sky>
<!-- Suelo -->
<a-plane color="#7BC8A4" height="20" position="0 0 0" rotation="-90 0 0" width="20"></a-plane>
<!-- Cubo -->
<a-box color="#4CC3D9" position="0 1 -3" rotation="0 45 0" shadow=""></a-box>
<!-- Esfera -->
<a-sphere color="#EF2D5E" position="2 1 -5" radius="1" shadow=""></a-sphere>
<!-- Cilindro -->
<a-cylinder color="#FFC65D" height="2" position="-2 1 -5" radius="0.5" shadow=""></a-cylinder>
<!-- Luz -->
<a-light color="#FFF" type="ambient"></a-light>
<a-light castshadow="true" intensity="0.5" position="0 10 0" type="directional"></a-light>
<!-- Cámara -->
<a-entity camera="" look-controls="" position="0 1.6 5" wasd-controls=""></a-entity>
</a-scene>
<script src="../js/note-system.js"></script></body>
</html>
