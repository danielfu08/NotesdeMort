<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <title>A-Frame — Escape Room Corregido</title>
    
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://agarci9inscastellet.github.io/scaperoom/js/scaperoom.js"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js" type="text/javascript"></script>

    <script>
        // Reset de estado si existe el parámetro 'clear'
        if (new URLSearchParams(window.location.search).has('clear')){
            resetStatus();
        }

        // Componente de Teletransporte
        AFRAME.registerComponent('teleport-handler', {
            init: function () {
                const player = document.getElementById('playerRig');
                
                // Listener para esferas tipo .teleport
                this.el.addEventListener('click', () => {
                    const pos = this.el.getAttribute('position');
                    if (this.el.classList.contains('teleport')) {
                        // Teletransporte con offset en Y (altura)
                        player.setAttribute('position', {x: pos.x, y: pos.y + 15, z: pos.z});
                    } else if (this.el.classList.contains('teleport2')) {
                        // Teletransporte directo
                        player.setAttribute('position', {x: pos.x, y: pos.y, z: pos.z});
                        player.setAttribute('rotation', "0 0 0");
                    }
                });
            }
        });
    </script>
</head>

<body>
    <a-scene cursor="rayOrigin: mouse" renderer="antialias: true; colorManagement: true">
        
        <a-assets>
            <a-asset-item id="modelAtic" src="atic.glb"></a-asset-item>
            <a-asset-item id="modelDoor" src="../assets/door.glb"></a-asset-item>
            <a-asset-item id="modelCassette" src="../assets/cassette.glb"></a-asset-item>
            <a-asset-item id="modelNote" src="../assets/note.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; intensity: 0.6"></a-entity>
        <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>

        <a-entity id="entidadAtic" 
                  gltf-model="#modelAtic" 
                  position="90 -25 -190" 
                  rotation="0 90 0" 
                  scale="0.25 0.25 0.25">
        </a-entity>

        <a-entity id="doora" 
                  gltf-model="#modelDoor" 
                  position="-6.99 -30.5 -7.2" 
                  rotation="0 90 0" 
                  scale="0.6 0.5 0.8">
        </a-entity>
        </a-entity>
        <a-entity id="entidadCassette1"
                  class="clickable"
                  gltf-model="#modelCassette"
                  position="27 76.3 -118"
                  scale="20 20 20">
        </a-entity>

        <a-entity id="entidadNota8"
                  class="clickable"
                  data-note-id="note8"
                  gltf-model="#modelNote"
                  position="-0.423 0.72 -0.715"
                  rotation="90 90 0"
                  scale="0.05 0.05 0.05">
        </a-entity>

        <a-sphere class="teleport" teleport-handler color="#FF0000" position="0 -15.3 0" radius="2"></a-sphere>
        <a-sphere class="teleport" teleport-handler color="#FF0000" position="0 68.3 -130" radius="2"></a-sphere>
        <a-sphere class="teleport" teleport-handler color="#FF0000" position="40 68.3 -150" radius="2"></a-sphere>

        <a-entity id="playerRig" position="0 0 0">
            <a-entity camera look-controls>
                <a-cursor fuse="false" raycaster="objects: .clickable, .teleport, .teleport2"></a-cursor>
            </a-entity>
        </a-entity>

    </a-scene>

   <script src="../js/note-system.js"></script>
<script src="../js/audios.js"></script>


<script>
// inicializar scaperoom
window.addEventListener('load', () => {

    catchableObject("#entidadNota8", "status_nota 9", "📝8");
    questionGate("#doora", 0, "../enfermeria/index.html", "status_nota 9");

});

const sound = document.querySelector("#sound");
const cassette = document.querySelector("#cassette1");
cassette.addEventListener("click", () => {

    playAudio("preso"); // assets/audios/preso.mp3

    cassette.setAttribute("visible", false);

});
</script>

</body>
</html>
