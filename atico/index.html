<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<title>A-Frame — passadis.glb con teletransporte</title>
<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
<script src="https://agarci9inscastellet.github.io/scaperoom/js/scaperoom.js"></script>
<script defer="">
     if (new URLSearchParams(window.location.search).has('clear')){
      resetStatus();
     }

  </script>
<link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" type="text/css"/>
<script src="https://cdn.jsdelivr.net/npm/toastify-js" type="text/javascript"></script>
</head>
<body>
<a-scene cursor="rayOrigin: mouse" renderer="antialias: true; colorManagement: true">
<!-- Carga del GLB -->
<a-assets>
<a-asset-item id="aticModel" src="atic.glb"></a-asset-item>
<a-asset-item id="doorModel" src="../assets/door.glb"></a-asset-item>
</a-assets>
<!-- Modelo visual -->
<a-entity gltf-model="#aticModel" material="metalness:0; roughness:1" position="90 -25 -190" rotation="0 90 0" scale="0.25 0.25 0.25">
</a-entity>
<a-entity gltf-model="#doorModel" id="door" material="metalness:0; roughness:1" position="-6.99 -30.5 -7.2" rotation="0 90 0" scale="0.6 0.5 0.8">
</a-entity>
<!-- Esferas de teletransporte -->
<a-sphere class="teleport" color="#FF0000" position="0 -15.300 0" radius="2"></a-sphere>
<a-sphere class="teleport" color="#FF0000" position="0 68.300 -130" radius="2"></a-sphere>
<a-sphere class="teleport" color="#FF0000" position="40 68.300 -150" radius="2"></a-sphere>
<!-- Cámara / jugador -->
<a-entity id="playerRig" position="0 0 0">
<a-entity camera="" look-controls="">
<!-- Cursor para hacer click -->
<a-cursor fuse="false" raycaster="objects: .clickable, .teleport, .teleport2"></a-cursor>
</a-entity>
</a-entity>
<!-- Iluminación -->
<a-entity light="type: ambient; intensity: 0.7"></a-entity>
<a-entity light="type: directional; intensity: 1" position="105 -190 5" rotation="-45 45 0"></a-entity>
<a-entity light="type: hemisphere; skyColor: #000000; groundColor: #000000; intensity: 0.5"></a-entity>
<!-- Componente de teletransporte -->
<script>
      AFRAME.registerComponent('teleport-on-click', {
  init: function () {
    const player = document.getElementById('playerRig');

    // Teleport normal
    const teleports = document.querySelectorAll('.teleport');
    teleports.forEach(function (sphere) {
      sphere.addEventListener('click', function () {
        const pos = sphere.getAttribute('position');
        player.setAttribute('position', `${pos.x} ${pos.y + 15} ${pos.z}`);
      });
    });

    // Teleport diferente
    const teleports2 = document.querySelectorAll('.teleport2');
    teleports2.forEach(function (sphere) {
      sphere.addEventListener('click', function () {
        const pos = sphere.getAttribute('position');

        // Teletransporte distinto
        player.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);

        // Ejemplo extra: cambiar rotación
        player.setAttribute('rotation', `0 0 0`);
      });
    });
  }
});
      document.querySelector('a-scene').setAttribute('teleport-on-click', '');
    </script>
</a-scene>
<script defer="">
  questionGate("#door", 0, "../conductos/index.html", "status_nota 1");

</script>
<script src="../js/note-system.js"></script></body>
</html>
