<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>A-Frame — Corregido</title>

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
<script src="https://agarci9inscastellet.github.io/scaperoom/js/scaperoom.js"></script>

<link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<script>

// reset
if (new URLSearchParams(window.location.search).has('clear')) {
    resetStatus();
}

// TELEPORT
AFRAME.registerComponent('teleport-on-click', {
            init: function () {
                const player = document.getElementById('playerRig');
                this.el.addEventListener('click', (evt) => {
                    if (evt.target.classList.contains('teleport')) {
                        const pos = evt.target.getAttribute('position');
                        // Ajustamos la altura (Y) para que no aparezcas dentro del suelo
                        player.setAttribute('position', {
                            x: pos.x, 
                            y: pos.y + 15, 
                            z: pos.z
                        });
                    }
                });
            }
        });

</script>
</head>


<body>
    <a-scene cursor="rayOrigin: mouse"
             renderer="antialias: true; colorManagement: true"
             teleport-on-click>

<a-assets>
    <a-asset-item id="modelAtic" src="atic.glb"></a-asset-item>
    <a-asset-item id="modelDoor" src="../assets/door.glb"></a-asset-item>
    <a-asset-item id="modelCassette" src="../assets/cassette.glb"></a-asset-item>
    <a-asset-item id="modelNote" src="../assets/note.glb"></a-asset-item>
        </a-assets>



<!-- PERSONAJE -->
<a-entity id="entidadAtic" 
                  gltf-model="#modelAtic" 
                  position="90 -25 -190" 
                  rotation="0 90 0" 
                  scale="0.25 0.25 0.25">
</a-entity>


<!-- PUERTA -->
<a-entity id="doora" 
          class="clickable"
          gltf-model="#modelDoor" 
          position="-6.99 -30.5 -7.2" 
          rotation="0 90 0" 
          scale="0.6 0.5 0.8">
    </a-entity>


<!-- CASSETTE -->
<a-entity id="cassette1"
          class="clickable aframe-clickable"
          gltf-model="#modelCassette"
          position="6.34 -18.61 -35.85"
          scale="20 20 20">
</a-entity>

<a-entity id="cassette1" class=""  gltf-model="../assets/cassette.glb" position="6.34 -18.61 -35.85" "="" scale="20 20 20" visible="false">
</a-entity>
</a-entity>
<!-- NOTA -->
        <a-entity id="entidadNota8"
                  class="clickable"
                  data-note-id="note8"
                  gltf-model="#modelNote"
                  position="26.13 75.28 -131.7"
                  rotation="90 90 0"
                  scale="0.05 0.05 0.05">
        </a-entity>
<a-entity id="entidadNota8" class="clickable aframe-clickable" data-note-id="note8" gltf-model="../assets/note.glb" position="26.13 75.28 -131.7" rotation="90 180 0" scale="0.5 0.5 0.5">
        </a-entity>

<!-- ENTIDAD AUDIO -->
<a-entity id="sound"
          sound="autoplay:false"
          positional: false;>
</a-entity>
        <a-sphere class="teleport" color="#FF0000" position="0 -15.3 0" radius="2"></a-sphere>
        <a-sphere class="teleport" color="#FF0000" position="0 68.3 -130" radius="2"></a-sphere>
        <a-sphere class="teleport" color="#FF0000" position="40 68.3 -150" radius="2"></a-sphere>

<!-- JUGADOR -->
<a-entity id="playerRig" position="0 -0.5 0">

<a-entity camera
          look-controls
          position="0 1.6 0">

<a-cursor fuse="false"
          raycaster="objects: .clickable, .teleport">
</a-cursor>

</a-entity>
</a-entity>


<!-- LUCES -->
<a-entity light="type: ambient; intensity: 0.7"></a-entity>
<a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>


</a-scene>



<script src="../js/note-system.js"></script>
<script src="../js/audios.js"></script>


<script>
// inicializar scaperoom
window.addEventListener('load', () => {
    catchableObject("#entidadNota8", "status_nota 8", "📝8");
    catchableObject("#cassette1", "status_cassette 1", "📼1")
    questionGate("#doora", 0, "../conductos/index.html", "status_nota 8", "status_cassette 1");
});
const sound = document.querySelector("#sound");
const cassette = document.querySelector("#cassette1");
cassette.addEventListener("click", () => {

    playAudio("atico"); // Asegúrate que este nombre existe en audios.js
    cassette.setAttribute("visible", false);

});

</script>


</body>
</html>
