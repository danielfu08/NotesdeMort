<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>A-Frame — passadis.glb con teletransporte</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://agarci9inscastellet.github.io/scaperoom/js/scaperoom.js"></script>

  <script defer>
     if (new URLSearchParams(window.location.search).has('clear')){
      resetStatus();
     }

  </script>

  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
  <a-scene cursor="rayOrigin: mouse" renderer="antialias: true; colorManagement: true">

    <!-- Carga del GLB -->
    <a-assets>
      <a-asset-item id="aticModel" src="atic.glb"></a-asset-item>
      <a-asset-item id="doorModel" src="../assets/door.glb"></a-asset-item>
      <a-asset-item id="noteModel" src="../assets/note.glb"></a-asset-item>
    </a-assets>

    <!-- Modelo visual -->
    <a-entity gltf-model="#aticModel"
              position="90 -25 -190"
              rotation="0 90 0"
              scale="0.25 0.25 0.25"
              material="metalness:0; roughness:1">
    </a-entity>
    <a-entity id="door"
              gltf-model="#doorModel"
              position="-6.99 -30.5 -7.2"
              rotation="0 90 0"
              scale="0.6 0.5 0.8"
              material="metalness:0; roughness:1">
    </a-entity>

    <a-entity id="note8"
              gltf-model="#noteModel"
              position="139.11433 75.19763 -80.41505"
              rotation="90 0 90"
              scale="0.75 0.75 0.75"
              material="metalness:0; roughness:1">
    </a-entity>

    <!-- Esferas de teletransporte -->
    <a-sphere class="teleport" position="0 -15.300 0" radius="2" color="#FF0000"></a-sphere>
    <a-sphere class="teleport" position="0 68.300 -130" radius="2" color="#FF0000"></a-sphere>
    <a-sphere class="teleport" position="40 68.300 -150" radius="2" color="#FF0000"></a-sphere>
    <a-sphere class="teleport" position="130 68.300 -150" radius="2" color="#FF0000"></a-sphere>
    <a-sphere class="teleport" position="130 68.300 -80" radius="2" color="#FF0000"></a-sphere>
    <a-sphere class="teleport" position="40 68.300 -80" radius="2" color="#FF0000"></a-sphere>







    <!-- Cámara / jugador -->
    <a-entity id="playerRig" position="0 0 0">
      <a-entity camera look-controls>
        <!-- Cursor para hacer click -->
        <a-cursor fuse="false" raycaster="objects: .teleport, .teleport2"></a-cursor>
      </a-entity>
    </a-entity>

    <!-- Iluminación -->
    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 1" position="105 -190 5" rotation="-45 45 0"></a-entity>
    <a-entity light="type: hemisphere; skyColor: #000000; groundColor: #000000; intensity: 0.5"></a-entity>

    <!-- Componente de teletransporte -->
    <script>
      AFRAME.registerComponent('teleport-on-click', {
  init: function () {
    const player = document.getElementById('playerRig');

    // Teleport normal
    const teleports = document.querySelectorAll('.teleport');
    teleports.forEach(function (sphere) {
      sphere.addEventListener('click', function () {
        const pos = sphere.getAttribute('position');
        player.setAttribute('position', `${pos.x} ${pos.y + 15} ${pos.z}`);
      });
    });

    // Teleport diferente
    const teleports2 = document.querySelectorAll('.teleport2');
    teleports2.forEach(function (sphere) {
      sphere.addEventListener('click', function () {
        const pos = sphere.getAttribute('position');

        // Teletransporte distinto
        player.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);

        // Ejemplo extra: cambiar rotación
        player.setAttribute('rotation', `0 0 0`);
      });
    });
  }
});
      document.querySelector('a-scene').setAttribute('teleport-on-click', '');
    </script>

  </a-scene>

<script defer>
  catchableObject("#note8","status_nota 8", "📝8");
  questionGate("#door", 0, "../conductos/index.html", "status_nota 7");

</script>



<div id="notePopup" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
  z-index:9999;
  font-family:'Special Elite', monospace;">
  <div id="notePopupInner" style="
    max-width:620px;
    padding:50px;
    border:1px solid #2a2a2a;
    background:rgba(10,10,10,0.95);
    color:#cfcfcf;
    text-align:center;
    box-shadow:0 0 40px rgba(0,0,0,0.9);">
    <h1 id="noteTitle" style="letter-spacing:4px;">NOTA ███</h1>
    <p id="noteText">Aquí irá el texto de la nota.</p>
    <button onclick="closeNote()" style="
      margin-top:20px;
      background:none;
      color:#cfcfcf;
      border:1px solid #444;
      padding:12px 25px;
      cursor:pointer;">Tancar</button>
  </div>
</div>

<script src="../notes_system.js"></script>
</body>
</html>
