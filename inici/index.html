<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>A-Frame — Escape Room Dinámico</title>
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://agarci9inscastellet.github.io/scaperoom/js/scaperoom.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body>

  <div id="notePopup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index:9999; font-family:'Courier New', monospace;">
    <div style="max-width:600px; padding:40px; border:1px solid #444; background:#0a0a0a; color:#cfcfcf; text-align:center; box-shadow:0 0 30px rgba(0,0,0,1);">
      <div id="noteContent">
        </div>
      <button onclick="closeNote()" style="margin-top:30px; background:none; color:#cfcfcf; border:1px solid #666; padding:10px 20px; cursor:pointer; text-transform:uppercase; letter-spacing:2px;">Cerrar</button>
    </div>
  </div>

  <a-scene cursor="rayOrigin: mouse" renderer="antialias: true; colorManagement: true">
    <a-assets>
      <a-asset-item id="finalModel" src="final.glb"></a-asset-item>
      <a-asset-item id="noteModel" src="../assets/note.glb"></a-asset-item>
      <a-asset-item id="doorModel2" src="../assets/door2.glb"></a-asset-item>
      <a-asset-item id="doorModel3" src="../assets/door3.glb"></a-asset-item>
    </a-assets>

    <a-entity gltf-model="#finalModel" position="100 -200 0"></a-entity>

    <a-entity id="note1" class="clickable" gltf-model="#noteModel" position="-155 -15 50" scale="2 2 2"></a-entity>
    
    <a-entity id="door2" class="clickable" gltf-model="#doorModel2" position="49.27 -56.91 -55.10" rotation="0 90 0" scale="0.5 0.5 1"></a-entity>
    <a-entity id="door3" class="clickable" gltf-model="#doorModel3" position="-54.88 -60 185" scale="0.25 0.3 0.25"></a-entity>

    <a-sphere class="teleport" position="33 61 -133" radius="3" color="#FF0000"></a-sphere>
    <a-sphere class="teleport" position="-53 0 133" radius="3" color="#FF0000"></a-sphere>
    <a-sphere class="teleport" position="-152 0 0" radius="4" color="#FF0000"></a-sphere>

    <a-entity id="playerRig" position="0 0 0">
      <a-entity camera look-controls>
        <a-cursor fuse="false" raycaster="objects: .clickable, .teleport"></a-cursor>
      </a-entity>
    </a-entity>

    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>
  </a-scene>

  <script>
let notesData = {};

// Carga el JSON al iniciar
fetch('/notes.json')
  .then(response => response.json())
  .then(data => {
    notesData = data;
  })
  .catch(err => console.error("Error cargando notas:", err));

function openNoteById(noteId){
  if(!notesData[noteId]){
    console.warn("Nota no encontrada:", noteId);
    return;
  }
  document.getElementById("noteTitle").innerHTML = notesData[noteId].title;
  document.getElementById("noteText").innerHTML = notesData[noteId].text;
  document.getElementById("notePopup").style.display = "flex";
}

function closeNote(){
  document.getElementById("notePopup").style.display = "none";
}

// Asocia todas las notas automáticamente
document.addEventListener("DOMContentLoaded", () => {
  const notes = document.querySelectorAll(".clickable"); // todas las entidades con clase clickable
  notes.forEach(note => {
    note.addEventListener("click", () => {
      openNoteById(note.id);
    });
  });
});
</script>
</body>
</html>
