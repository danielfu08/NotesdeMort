<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<title>A-Frame — final.glb con teletransporte</title>
<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
<script src="https://agarci9inscastellet.github.io/scaperoom/js/scaperoom.js"></script>
<script defer="">
     if (new URLSearchParams(window.location.search).has('?clear')){
      resetStatus();
     }

  </script>
<link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" type="text/css"/>
<script src="https://cdn.jsdelivr.net/npm/toastify-js" type="text/javascript"></script>
</head>
<body>
<a-scene cursor="rayOrigin: mouse" renderer="antialias: true; colorManagement: true">
<!-- Carga del GLB -->
<a-assets>
<a-asset-item id="finalModel" src="final.glb"></a-asset-item>
<a-asset-item id="noteModel1" src="../assets/note.glb"></a-asset-item>
<a-asset-item id="doorModel" src="../assets/door2.glb"></a-asset-item>
<a-asset-item id="doorModel3" src="../assets/door3.glb"></a-asset-item>
</a-assets>
<!-- Modelo visual -->
<a-entity gltf-model="#finalModel" material="metalness:0; roughness:1" position="100 -200 0" rotation="0 0 0" scale="1 1 1">
</a-entity>
<a-entity class="clickable" data-note-id="note1" gltf-model="#noteModel1" id="note1" material="metalness:0; roughness:1" position="-155 -15 50" rotation="0 0 0" scale="2 2 2">
</a-entity>
<a-entity gltf-model="../assets/door2.glb" id="door2" material="metalness:0; roughness:1" position="49.27468 -56.919 -55.102" rotation="0 90 0" scale="0.5 0.5 1">
</a-entity>
<a-entity gltf-model="../assets/door2.glb" id="door2-2" material="metalness:0; roughness:1" position="64.30275 -56.919 -150.65362" rotation="0 270 0" scale="0.5 0.5 1">
</a-entity>
<a-entity gltf-model="../assets/door3.glb" id="door3" material="metalness:0; roughness:1" position="-54.88653 -60 185" rotation="" scale="0.25 0.30 0.25">
</a-entity>
<!-- POPUP NOTA -->
<!-- Esferas de teletransporte -->
<a-sphere class="teleport" color="#FF0000" position="33 61 -133" radius="3"></a-sphere>
<a-sphere class="teleport" color="#FF0000" position="33 61 152" radius="3"></a-sphere>
<a-sphere class="teleport" color="#FF0000" position="-128 61 -133" radius="3"></a-sphere>
<a-sphere class="teleport" color="#FF0000" position="-128 65 151" radius="3"></a-sphere>
<a-sphere class="teleport" color="#FF0000" geometry=""status_nota material="" position="-53 -0 133" radius="3"></a-sphere>
<a-sphere class="teleport" color="#FF0000" geometry="" material="" position="38 -0 -0" radius="3"></a-sphere>
<a-sphere class="teleport" color="#FF0000" geometry="" material="" position="-51 -0 -173" radius="3"></a-sphere>
<a-sphere class="teleport" color="#FF0000" geometry="" material="" position="-152 -0 -0" radius="4"></a-sphere>
<!-- Cámara / jugador -->
<a-entity id="playerRig" position="0 0 0">
<a-entity camera="" look-controls="">
<!-- Cursor para hacer click -->
<a-cursor fuse="false" raycaster="objects: .clickable, .teleport"></a-cursor>
</a-entity>
</a-entity>
<!-- Iluminación -->
<a-entity light="type: ambient; intensity: 0.7"></a-entity>
<a-entity light="type: directional; intensity: 1" position="105 -190 5" rotation="-45 45 0"></a-entity>
<a-entity light="type: hemisphere; skyColor: #ffffff; groundColor: #444444; intensity: 0.5"></a-entity>
<!--Notes-->
<!-- Componente de teletransporte -->
<script>
      AFRAME.registerComponent('teleport-on-click', {
        init: function () {
          const spheres = document.querySelectorAll('.teleport');
          const player = document.getElementById('playerRig');

          spheres.forEach(function(sphere) {
            sphere.addEventListener('click', function () {
              const pos = sphere.getAttribute('position');
              player.setAttribute('position', `${pos.x} ${pos.y + 1.6} ${pos.z}`);
            });
          });
        }
      });

      document.querySelector('a-scene').setAttribute('teleport-on-click', '');
    </script>
<script defer="">
  
  questionGate("#door2", 1, "../lavabos/index.html", "status_nota 1");
  catchableObject("#note1","status_nota 1", "📝1");
  questionGate("#door3", 2, "../passadis/index.html", "status_nota 2");
</script>
</a-scene>
<script src="../js/note-system.js"></script>
</body>
</html>
