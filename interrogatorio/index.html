<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8"/>
  <title>ARXIU █████ - FINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #0a0a0a;
      color: #cfcfcf;
      font-family: 'Special Elite', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.04"/></svg>');
      animation: flicker 0.2s infinite;
      z-index: 10;
    }

    @keyframes flicker {
      0% { opacity: 0.03; }
      50% { opacity: 0.06; }
      100% { opacity: 0.03; }
    }

    #terminal {
      width: 80%;
      max-width: 800px;
      padding: 40px;
      background: rgba(15, 15, 15, 0.95);
      border: 1px solid #333;
      box-shadow: 0 0 30px rgba(0, 0, 0, 1);
      position: relative;
      z-index: 20;
    }

    .line {
      margin-bottom: 15px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.5s ease-out;
    }

    .line.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .highlight {
      color: #a33;
      font-weight: bold;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.2em;
      background: #cfcfcf;
      margin-left: 5px;
      animation: blink 1s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #final-buttons {
      margin-top: 40px;
      display: none;
      justify-content: center;
      gap: 20px;
    }

    button {
      background: none;
      color: #cfcfcf;
      border: 1px solid #444;
      padding: 12px 24px;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s;
    }

    button:hover {
      background: #a33;
      color: #000;
      border-color: #a33;
    }

    .stamp {
      position: absolute;
      top: 20px;
      right: 20px;
      border: 3px solid #a33;
      color: #a33;
      padding: 10px;
      transform: rotate(15deg);
      font-weight: bold;
      opacity: 0;
      transition: opacity 1s;
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  
  <div id="terminal">
    <div class="stamp" id="classified-stamp">TOP SECRET</div>
    <div id="lines-container"></div>
    <div id="final-buttons">
      <button onclick="window.location.href='../index.html?clear'">TORNAR A L'INICI</button>
    </div>
  </div>

  <script>
    const storyLines = [
      "INICIANT DESXIFRAT DE L'ARXIU █████...",
      "SALA D'INTERROGATORI: <span class='highlight'>RECONSTRUCCIÓ FINAL</span>",
      "------------------------------------------",
      "Ara no estàs interrogant ningú.",
      "Estàs escoltant la història.",
      "Recollint les últimes proves...",
      "Entenent els fragments de memòria.",
      "Veient la <span class='highlight'>veritat</span> darrere del pacient.",
      "Enllaçant els records perduts de l'hospital.",
      "Llegint cada nota. Obrint els ulls.",
      "------------------------------------------",
      "CONCLUSIONS DEL CAS:",
      "- El pacient no estava boig.",
      "- Les dosis d'infermeria eren <span class='highlight'>silenciadors</span>.",
      "- L'escapada va ser un <span class='highlight'>missatge</span>.",
      "------------------------------------------",
      "L'INVESTIGACIÓ HA FINALITZAT.",
      "HAS COMPLETAT: <span class='highlight'>NOTES DE MORT</span>",
      "Gràcies per escoltar."
    ];

    const container = document.getElementById('lines-container');
    const buttons = document.getElementById('final-buttons');
    const stamp = document.getElementById('classified-stamp');

    async function typeStory() {
      for (let i = 0; i < storyLines.length; i++) {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'line';
        lineDiv.innerHTML = storyLines[i];
        container.appendChild(lineDiv);
        
        // Pequeño delay para el efecto de escritura
        await new Promise(r => setTimeout(r, 800));
        lineDiv.classList.add('visible');
        
        if (i === storyLines.length - 1) {
          const cursor = document.createElement('span');
          cursor.className = 'cursor';
          lineDiv.appendChild(cursor);
        }

        // Scroll al final si fuera necesario
        window.scrollTo(0, document.body.scrollHeight);
      }

      // Mostrar sello y botones al final
      setTimeout(() => {
        stamp.style.opacity = '0.3';
        buttons.style.display = 'flex';
      }, 1000);
    }

    window.onload = () => {
      // Pequeño retraso inicial
      setTimeout(typeStory, 1000);
    };
  </script>
</body>
</html>
