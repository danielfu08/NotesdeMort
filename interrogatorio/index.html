<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>A-Frame — final.glb con puerta y llave</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://agarci9inscastellet.github.io/scaperoom/js/scaperoom.js"></script>

  <script defer>
     if (new URLSearchParams(window.location.search).has('clear')){
      resetStatus();
     }

  </script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

</head>
<body>

<a-scene a-scene cursor="rayOrigin: mouse" 
          renderer="antialias: true; colorManagement: true">

  <!-- Assets -->
  <a-assets>
    <a-asset-item id="finalModel" src= "interrogati.glb"></a-asset-item>
    <!-- puerta -->
    <a-asset-item id="trapModel2" src="../assets/trapdoor2.glb"></a-asset-item>
      <!-- nota -->
    <a-asset-item id="note10Model" src="../assets/note.glb"></a-asset-item>
  
  </a-assets>
 <!-- escenario -->
  <a-entity gltf-model="interrogati.glb" 
            position="-6 -1 -2" 
            rotation="" 
            scale="3 3 3">
  </a-entity>

  </a-entity>
  <!-- Cassette -->
    <a-entity id="trapdoor2" 
                gltf-model="../assets/trapdoor2.glb" 
                position="-4.07954 0.22108 0.95367" 
                rotation="90 90 90" 
                scale="0.25 0.25 0.25" 
                class="aframe-clickable">
    </a-entity>

        <a-entity id="note10" 
                 class="clickable" 
                 gltf-model="#note10Model" 
                 position="-7.59516 -0.39034 -4.97679" 
                 rotation="90 0 0" 
                 scale="0.025 0.025 0.025">
        </a-entity>


  <!-- TELEPORTS -->
    <a-sphere class="teleport aframe-clickable" position="-7 -1.5 0.5" radius="0.1" color="#FF0000"  material=""  geometry="">  </a-sphere>
    <a-sphere class="teleport aframe-clickable" position="-4.6 -1.5 0.5" radius="0.1" color="#FF0000"  material=""  geometry="">  </a-sphere>
    <a-sphere class="teleport aframe-clickable" position="-7.5 -1.5 -2" radius="0.1" color="#FF0000"  material=""  geometry="">  </a-sphere>
    <a-sphere class="teleport aframe-clickable" position="-4.6 -1.5 -3.5" radius="0.1" color="#FF0000"  material=""  geometry="">  </a-sphere>
    <a-sphere class="teleport aframe-clickable" position="-7 -1.5 -3.5" radius="0.1" color="#FF0000"  material=""  geometry="">  </a-sphere>




     
  <!-- jugador -->
    <a-entity id="playerRig" 
                position="-4.6 -0.75 0.48" 
                rotation="0 0 0">
        <a-entity camera="" 
                    look-controls="" 
                    position="" 
                    rotation="" 
                    data-aframe-inspector-original-camera="">
        <a-cursor fuse="false" 
                    raycaster="objects: .teleport, .clickable" 
                    material="" 
                    cursor="" 
                    geometry="">
                </a-cursor>
        </a-entity>
    </a-entity>




  <!-- luces -->
  <a-entity light="type: ambient; intensity: 0.7"></a-entity>
  <a-entity light="type: directional; intensity: 1"
            position="105 -190 5"
            rotation="-45 45 0"></a-entity>

</a-scene>


<!-- TELEPORT -->
<script>

AFRAME.registerComponent('teleport-on-click', {

  init: function () {

    const spheres = document.querySelectorAll('.teleport');
    const player = document.getElementById('playerRig');

    spheres.forEach(function(sphere) {

      sphere.addEventListener('click', function () {

        const pos = sphere.getAttribute('position');

        player.setAttribute('position',
          `${pos.x} ${pos.y+0.748} ${pos.z}`);

      });

    });

  }

});

document.querySelector('a-scene')
        .setAttribute('teleport-on-click', '');

</script>

<script defer>
  questionGate("#trapdoor2", 0, "../conductos/index2.html", "status_nota 9");
  catchableObject("#note10","status_nota 10", "📝10");


</script>

</body>
</html>
